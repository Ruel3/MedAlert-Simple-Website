services:
  - type: web
    name: medalert
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MEDALERT_DB_PATH
        value: /var/data/medalert.sqlite
    disk:
      name: medalert-data
      mountPath: /var/data
      sizeGB: 1
